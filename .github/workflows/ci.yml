# Batched static-check CI for livespec-driver-pi.
#
# Family conventions scaled to this repo's content. Every step delegates to
# `just <target>` (direct tool invocations in `run:` lines are forbidden per
# livespec/SPECIFICATION/non-functional-requirements.md §"Toolchain pins").
#
# BATCHED SHAPE (work-item livespec-dev-tooling-yilyxr.9, porting
# livespec-dev-tooling PR #1469 via livespec-driver-claude PR #516 and
# livespec-driver-codex PR #484). The previous shape ran all 61 canonical +
# repo-private check slugs as individual `strategy.matrix.target` legs, each
# paying the same ~20s container + `mise trust` + `uv sync --all-groups` setup
# tax for a scan that finishes in well under a minute. The setup tax dominated
# the run. This shape keeps a matrix leg ONLY for the targets whose own runtime
# dominates their setup — the four tool-backed gates plus the pytest-spawning
# coverage targets and the two commit-range walkers — and collapses every
# sub-minute scanner into two consolidated batch jobs that pay the setup once
# and run their targets serially.
#
# Failure reporting in the batch jobs is COLLECTED, not fail-fast: each `just
# <slug>` line records its slug into a `failed` accumulator and the job exits 1
# at the end listing every failure. That preserves the diagnostic value of the
# old `fail-fast: false` matrix — one run still tells you every check that is
# red, not just the first.
#
# The batch jobs satisfy the shape invariants the meta-checks enforce:
#   - check-tool-backed-check-completeness requires check-lint / check-format /
#     check-types / check-coverage to be LITERAL `matrix.target` members, so
#     those four stay in the check-python matrix and MUST NOT move to a batch.
#   - check-ci-matrix-completeness assertion (a) counts a job's canonical
#     coverage as its matrix targets UNION every `just <canonical-slug>` its
#     `run:` lines invoke, so each batched target appears as its own literal
#     `just <slug>` line rather than being looped over a shell array.
#   - check-ci-matrix-completeness assertion (b) requires every GATING job
#     (matrix-bearing or `just`-running) to appear in `ci-green.needs`, so both
#     batch jobs are listed there.
#
# The three WORLD-GATE canonical checks (check-master-ci-green,
# check-branch-protection-alignment, check-plan-epic-parity) are deliberately
# absent: they verify master/world state under a maintainer admin token, are
# excluded from the CI-mirror requirement by
# canonical_checks.world_gate_check_slugs and livespec/.ai/ci-gate-discipline.md,
# and enforce at pre-push.
#
# The check jobs all run in the SAME baked image the Fabro sandbox uses — so
# "green in CI" and "green in sandbox" are the same environment.
#
# RUNNER ROUTING — FAILS CLOSED TO HOSTED CAPACITY.
#
# runs-on resolves from the repo variable CI_RUNNER_LABELS, defaulting to
# '["ubuntu-latest"]' when it is absent or empty. That default is the
# merge-gate safety property, not a convenience: livespec
# SPECIFICATION/non-functional-requirements.md §"Self-hosted CI runner host
# requirements" → "Availability MUST NOT become a merge dependency" requires a
# route back to hosted capacity that needs no specification revision, because a
# single all-green gate is the sole required check. ci-green needs the check
# jobs, so one routed to self-hosted capacity that is not there does not FAIL —
# it sits in `queued`, ci-green never reports, and every merge waits on a check
# that will not arrive. Defaulting to the self-hosted label made exactly that
# outcome the behavior of an absent variable.
#
# To route gating jobs to a conforming self-hosted host, SET CI_RUNNER_LABELS
# to that host's label. To return them to hosted capacity, unset it or set it
# to '["ubuntu-latest"]'. Both directions are repo-variable edits; neither
# needs a specification revision.
#
# The fallback literal is repeated inline at each runs-on rather than
# single-sourced through a job output, and every copy MUST stay in lockstep.
# The repetition is deliberate: the fleet's self-hosted routing guard parses
# runs-on values STATICALLY, so routing hidden behind `needs.<job>.outputs.*`
# would read as "this workflow has no self-hosted job" and silently disable the
# forbidden-trigger check.
#
# This repo has NOT been added to the self-hosted pool: CI_RUNNER_LABELS is
# unset, so every gating job runs on hosted capacity. Routing it to the pool
# later is a repo-variable edit; this comment does not need to change either
# way.
#
# ci-green and export-telemetry stay ubuntu-latest so the gate is reportable
# host-down.

name: CI

# uv occasionally fails when the PyPI file CDN (files.pythonhosted.org)
# drops a wheel download mid-stream ("broken pipe"). UV_HTTP_RETRIES
# makes uv retry the fetch in-process instead of failing the job.
#
# mise reaches the SAME class of CDN (GitHub releases) for its tool binaries
# and can fail identically. mise's own default is `http_retries = 0` — one
# attempt, no retry — so the lesson already learned for uv had to be spelled
# out again here.
env:
  UV_HTTP_RETRIES: "5"
  MISE_HTTP_RETRIES: "5"
  # uv's own concurrent-downloads default is 50 in-flight fetches PER uv
  # invocation (docs.astral.sh/uv/reference/settings/#concurrent-downloads).
  # The self-hosted pool runs many job slots concurrently on ONE host, so a
  # cold-cache moment (fresh slots, or a lockfile bump) can open thousands of
  # simultaneous connections to files.pythonhosted.org from a single shared
  # uplink -- the cause of the "operation timed out" PyPI fetch failures that
  # have red-flagged gating CI on the pool (livespec-s43svm.13, and the
  # recurrence livespec-s43svm.31 that brought this variable here). Capping
  # per-job concurrency on the self-hosted lane trades a little per-job fetch
  # latency for bounding the HOST-WIDE aggregate connection count; the hosted
  # lane's fully-isolated, independent-network-path runners never see this
  # contention, so it stays at uv's own default there. UV_HTTP_TIMEOUT is
  # bumped alongside it on the self-hosted lane, since a still-congested
  # transfer is more likely to need longer than the 30s default even at
  # reduced concurrency.
  #
  # The `|| '["ubuntu-latest"]'` default carries the same fail-closed property
  # as the runs-on fallbacks in this file and MUST stay in lockstep with them.
  UV_CONCURRENT_DOWNLOADS: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '50' || '4' }}
  UV_HTTP_TIMEOUT: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '30' || '60' }}

# merge_group is deliberately ABSENT: no merge queue is configured for this
# repo. Keeping the vestigial trigger would be exactly the routing hole the
# trusted-event audit forbids, since merge_group is not a fork-gated event.
# Re-add it WITH hosted routing only if a merge queue is adopted.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  # Targets whose OWN runtime dominates the per-job setup tax, so a dedicated
  # leg buys real wall-clock parallelism rather than paying setup twice for a
  # sub-minute scan. Two distinct reasons a slug is here:
  #
  #   - check-lint / check-format / check-types are three of the four
  #     fixed-policy TOOL-BACKED gates, which
  #     check-tool-backed-check-completeness requires to be literal
  #     `matrix.target` members of BOTH the `just check` targets array AND a CI
  #     matrix. They are also genuinely slow (ruff over the tree, a full pyright
  #     pass).
  #   - The fourth tool-backed gate, check-coverage, keeps its literal
  #     `matrix.target` membership too, but in the single-entry matrix of the
  #     coverage-pair producer job below — it and check-per-file-coverage both
  #     spawn a suite, so they are chained rather than run side by side.
  check-python:
    name: ${{ matrix.target }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.31.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # The four tool-backed gates MUST stay literal members here
          # (check-tool-backed-check-completeness's both-surfaces invariant).
          - check-lint
          - check-format
          - check-types
          # check-coverage and check-per-file-coverage moved OUT of this matrix
          # into the producer/consumer job chain below (work-item
          # livespec-dev-tooling-yilyxr.8, porting dev-tooling PRs #1504 +
          # #1511): as sibling legs they each ran the full suite on their own
          # runner, so the pair paid the suite twice. check-coverage stays a
          # LITERAL matrix member there, in a single-entry matrix, to keep
          # check-tool-backed-check-completeness satisfied.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: keeping one checkout shape across every container job
          # below avoids a per-job "does this leg need history" question, and
          # the metadata jobs genuinely need origin/master reachable. Cheap for
          # this repo.
          fetch-depth: 0

      # GitHub-hosted routing keeps the baked `container:` image, so the
      # workspace is checked out as the runner uid (1001) on the host while
      # every step runs git as ROOT inside the container — git then refuses
      # with "detected dubious ownership" (exit 128). actions/checkout adds its
      # own safe.directory but scopes it to a temporary HOME it discards, and
      # resolve_repo_root() (config.py) strips all GIT_* env before shelling
      # git, so an env-var safe.directory is invisible to it. Write it to the
      # global gitconfig ($HOME/.gitconfig, HOME=/github/home) instead, which
      # every git call — scrubbed or not — reads. No-op on the self-hosted lane.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      # Self-hosted lane only: actions/checkout's self-hosted fetch for a
      # pull_request event is a SHALLOW --depth=1 fetch of ONLY the
      # GitHub-synthesized merge commit, despite fetch-depth: 0 above
      # requesting full history. Two distinct symptoms:
      #
      # 1. `refs/remotes/origin/*` is never (re-)established, leaving
      #    `origin/master` unresolvable and failing any origin/master..HEAD
      #    range enumeration.
      # 2. On a pull_request event, HEAD is a GitHub-synthesized MERGE
      #    commit with two parents. The shallow fetch brings the merge
      #    commit's OWN object but never the PR branch tip's own commit
      #    object, so `git rev-list --no-merges origin/master..HEAD` cannot
      #    walk that side of the graph.
      #
      # `git fetch --unshallow` fixes both. It errors on an already-complete
      # repository, so it is guarded by `--is-shallow-repository`. Hosted's
      # fresh, always-shallow-free clone never hits either symptom, so this
      # step is a cheap no-op there.
      - name: Ensure full history is available (self-hosted reused _work dir)
        if: ${{ !contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi
          git fetch origin master:refs/remotes/origin/master

      # Tools are baked into the image; `mise install` is a near-no-op that just
      # confirms the pinned versions. A fresh container does not TRUST the repo
      # .mise.toml, so `mise trust` is required for the shims to resolve.
      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just ${{ matrix.target }}
        run: |
          # pyright (check-types) shells out to `npm`; under the container-hooks
          # HOME the mise npm shim busy-loops (no node registered for that HOME).
          # Put the image's real node/npm — derived from the shim's own location,
          # never a hardcoded image path — ahead of the shim on PATH. Harmless
          # for the non-npm targets.
          shims_dir="$(dirname "$(command -v npm)")"
          node_bin="$(cd "$shims_dir/../installs/node/latest/bin" 2>/dev/null && pwd || ls -d "$shims_dir/../installs/node"/*/bin 2>/dev/null | head -1)"
          [ -n "$node_bin" ] && export PATH="$node_bin:$PATH"
          just ${{ matrix.target }}

  # Coverage-pair PRODUCER (work-item livespec-dev-tooling-yilyxr.8, porting
  # dev-tooling PRs #1504 + #1511). This repo's direction is INVERTED relative
  # to dev-tooling's, and the recipes are what decide it: here `check-coverage`
  # runs `env -u COVERAGE_FILE uv run pytest tests/ --cov ...`
  # UNCONDITIONALLY and leaves the repo-root .coverage behind, while
  # `check-per-file-coverage` is the one carrying the `if [[ ! -f .coverage ]]`
  # fallback and the consume-once `rm -f`. So check-coverage produces and
  # check-per-file-coverage consumes — exactly the local `just check` ordering,
  # now effective in CI where the two matrix legs used to run the suite
  # independently on separate runners.
  #
  # Kept as a single-entry matrix (NOT a plain job) because check-coverage is a
  # tool-backed slug and check-tool-backed-check-completeness requires every
  # tool-backed slug to be a LITERAL matrix.target member.
  check-coverage:
    name: ${{ matrix.target }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.31.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      matrix:
        target:
          - check-coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      # Same self-hosted shallow-fetch repair as check-python — see that job
      # for the full rationale.
      - name: Ensure full history is available (self-hosted reused _work dir)
        if: ${{ !contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi
          git fetch origin master:refs/remotes/origin/master

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just ${{ matrix.target }}
        run: |
          # The suite spawns `node` in some tests; under the container-hooks
          # HOME the mise node/npm shims busy-loop or miss (no node registered
          # for that HOME), so put the image's real node bin — derived from the
          # shim's own location, never a hardcoded image path — ahead of the
          # shims on PATH. Same block as the check-python matrix legs; its
          # absence from dev-tooling's equivalent producer job reddened that
          # repo's master with FileNotFoundError: 'node' (fixed by #1511).
          shims_dir="$(dirname "$(command -v npm)")"
          node_bin="$(cd "$shims_dir/../installs/node/latest/bin" 2>/dev/null && pwd || ls -d "$shims_dir/../installs/node"/*/bin 2>/dev/null | head -1)"
          [ -n "$node_bin" ] && export PATH="$node_bin:$PATH"
          just ${{ matrix.target }}

      # include-hidden-files is REQUIRED: upload-artifact@v4 excludes dotfiles
      # by default and .coverage is one; without it the upload silently ships
      # nothing and the consumer falls back to a full duplicate suite run.
      - name: Publish .coverage for the check-per-file-coverage consumer
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Coverage-pair CONSUMER. A plain dedicated job (no matrix): the
  # literal-matrix-member rule from check-tool-backed-check-completeness
  # applies only to the tool-backed slugs (lint / format / types / coverage),
  # and check-per-file-coverage is not one. `needs` the producer so the
  # downloaded .coverage is present and the recipe takes its reuse branch,
  # printing ":: check-per-file-coverage: reading .coverage from
  # check-coverage's clean run (no duplicate suite run)". The recipe then
  # DELETES the file (consume-once), which is harmless in CI — each job gets a
  # fresh workspace. Paths inside the data file match because both jobs run in
  # the same container workspace mount. If the download ever regresses, the
  # recipe's fallback runs the clean suite standalone — slower, never wrong.
  check-per-file-coverage:
    name: check-per-file-coverage
    needs: check-coverage
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.31.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: Ensure full history is available (self-hosted reused _work dir)
        if: ${{ !contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi
          git fetch origin master:refs/remotes/origin/master

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: Download the producer's .coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: just check-per-file-coverage
        run: |
          # Node-PATH shim for the standalone-fallback branch only: the normal
          # path reads the downloaded .coverage without spawning anything, but
          # a missing artifact falls back to the clean suite, which spawns
          # `node` in some tests (see the producer job).
          shims_dir="$(dirname "$(command -v npm)")"
          node_bin="$(cd "$shims_dir/../installs/node/latest/bin" 2>/dev/null && pwd || ls -d "$shims_dir/../installs/node"/*/bin 2>/dev/null | head -1)"
          [ -n "$node_bin" ] && export PATH="$node_bin:$PATH"
          just check-per-file-coverage

  # Batched cheap .py-scanning checks: one container setup for 24 sub-minute
  # AST/structure scanners that used to be 24 matrix legs. Failures are
  # COLLECTED so one run still reports every red target (the old matrix's
  # `fail-fast: false` property). Each target is a literal `just <slug>` line
  # so check-ci-matrix-completeness assertion (a) credits this job with them.
  #
  # check-pi-package-structure is this repo's private .py-shaped extra (NOT
  # canonical); it batches here alongside the canonical scanners.
  check-python-batch:
    name: check-python-batch
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.31.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # See check-python for the full root-vs-checkout-uid rationale.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      # See check-python for the full self-hosted shallow-fetch rationale.
      - name: Ensure full history is available (self-hosted reused _work dir)
        if: ${{ !contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi
          git fetch origin master:refs/remotes/origin/master

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: Run the batched python checks
        run: |
          failed=""
          just check-all-declared || failed="$failed check-all-declared"
          just check-assert-never-exhaustiveness || failed="$failed check-assert-never-exhaustiveness"
          just check-check-mutation || failed="$failed check-check-mutation"
          just check-file-lloc || failed="$failed check-file-lloc"
          just check-global-writes || failed="$failed check-global-writes"
          just check-keyword-only-args || failed="$failed check-keyword-only-args"
          just check-main-guard || failed="$failed check-main-guard"
          just check-match-keyword-only || failed="$failed check-match-keyword-only"
          just check-newtype-domain-primitives || failed="$failed check-newtype-domain-primitives"
          just check-no-except-outside-io || failed="$failed check-no-except-outside-io"
          just check-no-fmt-directives || failed="$failed check-no-fmt-directives"
          just check-no-inheritance || failed="$failed check-no-inheritance"
          just check-no-lloc-soft-warnings || failed="$failed check-no-lloc-soft-warnings"
          just check-no-raise-outside-io || failed="$failed check-no-raise-outside-io"
          just check-no-write-direct || failed="$failed check-no-write-direct"
          just check-pbt-coverage-pure-modules || failed="$failed check-pbt-coverage-pure-modules"
          just check-pi-package-structure || failed="$failed check-pi-package-structure"
          just check-private-calls || failed="$failed check-private-calls"
          just check-public-api-result-typed || failed="$failed check-public-api-result-typed"
          just check-rop-pipeline-shape || failed="$failed check-rop-pipeline-shape"
          just check-supervisor-discipline || failed="$failed check-supervisor-discipline"
          just check-tests-mirror-pairing || failed="$failed check-tests-mirror-pairing"
          just check-tests-no-subprocess-spawn || failed="$failed check-tests-no-subprocess-spawn"
          just check-wrapper-shape || failed="$failed check-wrapper-shape"
          if [ -n "$failed" ]; then
            echo "Failed targets:$failed"
            exit 1
          fi

  # Metadata targets that keep their own leg: both enumerate a COMMIT RANGE
  # (origin/master..HEAD) rather than scanning the working tree, so their
  # runtime is history-sized and variable, and check-red-green-replay
  # additionally re-runs pytest per replayed commit.
  #
  # check-red-green-replay (epic livespec-gcp2) validates that every non-merge
  # commit in origin/master..HEAD touching product impl .py carries EITHER the
  # TDD-Red-*/TDD-Green-* pair shape OR the TDD-Suite-Green-* shape, regardless
  # of subject prefix. A lefthook-only gate is locally bypassable and this fleet
  # is CI-authoritative, so the ritual MUST also run here. It runs
  # UNCONDITIONALLY: on a zero-.py PR the range carries no product .py and
  # trivially passes; on a master push the range is empty. It NEVER silently
  # passes — an unresolvable base fails the job actionably.
  check-metadata:
    name: ${{ matrix.target }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.31.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - check-red-green-replay
          - check-check-coverage-incremental
    steps:
      - name: Checkout (full history for commit-range validation)
        uses: actions/checkout@v4
        with:
          # Full history: the range validation enumerates origin/master..HEAD
          # and needs origin/master plus the merge base present in the clone. A
          # shallow (fetch-depth: 1) checkout would make the base unresolvable
          # and fail the check actionably — never a silent pass.
          fetch-depth: 0

      # See check-python for the full root-vs-checkout-uid rationale.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      # See check-python for the full self-hosted shallow-fetch rationale. This
      # job is the one that most needs it: both targets resolve origin/master.
      - name: Ensure full history is available (self-hosted reused _work dir)
        if: ${{ !contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi
          git fetch origin master:refs/remotes/origin/master

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just ${{ matrix.target }}
        run: just ${{ matrix.target }}

  # Batched cheap repo-metadata checks: one container setup for 31 sub-minute
  # targets that used to be 31 matrix legs. Failures are COLLECTED; every
  # target is a literal `just <slug>` line (assertion (a)) and the job is
  # gating (assertion (b): listed in ci-green.needs).
  #
  # check-spec-governance-default-block is this repo's private spec-governance
  # extra (NOT canonical); it batches here with the other metadata scanners.
  #
  # The commit-refuse hook and the worktree pack install UNCONDITIONALLY here,
  # because the two checks that need them
  # (check-primary-checkout-commit-refuse-hook-installed, check-shell-quality)
  # both live in this batch. In the old per-leg matrix these installs were
  # gated on `matrix.target ==` conditions; a batch job has no such selector,
  # and installing both for every run of this one job is cheap.
  check-metadata-batch:
    name: check-metadata-batch
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.31.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: check-commit-pairs-source-and-test diffs against
          # origin/master, and several plan/ledger checks read history.
          fetch-depth: 0

      # See check-python for the full root-vs-checkout-uid rationale.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      # See check-python for the full self-hosted shallow-fetch rationale.
      - name: Ensure full history is available (self-hosted reused _work dir)
        if: ${{ !contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi
          git fetch origin master:refs/remotes/origin/master

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      # CI's actions/checkout does NOT install the git hooks, so
      # check-primary-checkout-commit-refuse-hook-installed would fail.
      # Install them here — AFTER uv sync, so the installer module is
      # importable — REUSING the same from-package installer bootstrap uses.
      # The verifier only READS the hook file; the hook never fires in CI.
      - name: Install canonical commit-refuse hook (satisfy invariant)
        run: just install-commit-refuse-hooks

      # Same rationale: a fresh `actions/checkout` has no materialized worktree
      # pack (the pack is gitignored-and-installed, never tracked), so the
      # verifier's pack arm has nothing to compare against on an untouched
      # runner. Installs from the SAME package source the check reads.
      #
      # check-shell-quality ALSO needs this, and without it that check passed
      # VACUOUSLY. `dev-tooling/*.just` is gitignored and this justfile imports
      # it OPTIONALLY (`import?`), so on an untouched runner the `worktree-*`
      # recipes DO NOT EXIST and the scan had no subject — green for work it
      # never did.
      - name: Install canonical worktree pack (satisfy invariant)
        run: just install-worktree-pack

      - name: Run the batched metadata checks
        env:
          # Arm the CI-matrix drift guard: with this repo's jobs + ci-green
          # complete, flip check-ci-matrix-completeness from warn (exit 0) to
          # FAIL (exit 4), so any future canonical slug wired into `just check`
          # but dropped from CI reddens this job instead of silently warning.
          # Harmless for the other batched targets — they do not read this var.
          LIVESPEC_FAIL_IF_CI_MATRIX_GAPS_EXIST: "true"
        run: |
          failed=""
          just check-agents-ai-references-resolve || failed="$failed check-agents-ai-references-resolve"
          just check-aggregate-completeness || failed="$failed check-aggregate-completeness"
          just check-canonical-recipe-fidelity || failed="$failed check-canonical-recipe-fidelity"
          just check-check-tools || failed="$failed check-check-tools"
          just check-ci-matrix-completeness || failed="$failed check-ci-matrix-completeness"
          just check-claude-md-coverage || failed="$failed check-claude-md-coverage"
          just check-comment-line-anchors || failed="$failed check-comment-line-anchors"
          just check-commit-pairs-source-and-test || failed="$failed check-commit-pairs-source-and-test"
          just check-fleet-marketplace-relative-sources || failed="$failed check-fleet-marketplace-relative-sources"
          just check-handoff-dispatch-routing || failed="$failed check-handoff-dispatch-routing"
          just check-heading-coverage || failed="$failed check-heading-coverage"
          just check-hook-trees-not-io-exempt || failed="$failed check-hook-trees-not-io-exempt"
          just check-local-memory-drift-audit || failed="$failed check-local-memory-drift-audit"
          just check-no-direct-destructive-cli || failed="$failed check-no-direct-destructive-cli"
          just check-no-direct-tool-invocation || failed="$failed check-no-direct-tool-invocation"
          just check-no-shadow-ledger-body-identical || failed="$failed check-no-shadow-ledger-body-identical"
          just check-no-shadow-ledger-body-typechecks || failed="$failed check-no-shadow-ledger-body-typechecks"
          just check-no-todo-registry || failed="$failed check-no-todo-registry"
          just check-partition-completeness || failed="$failed check-partition-completeness"
          just check-plan-anchor-declared || failed="$failed check-plan-anchor-declared"
          just check-plan-no-tombstone || failed="$failed check-plan-no-tombstone"
          just check-plugin-resolution || failed="$failed check-plugin-resolution"
          just check-primary-checkout-commit-refuse-hook-installed || failed="$failed check-primary-checkout-commit-refuse-hook-installed"
          just check-required-role-keys-declared || failed="$failed check-required-role-keys-declared"
          just check-self-hosted-routing || failed="$failed check-self-hosted-routing"
          just check-self-hosted-uv-lane || failed="$failed check-self-hosted-uv-lane"
          just check-shell-quality || failed="$failed check-shell-quality"
          just check-skill-invocation-paths || failed="$failed check-skill-invocation-paths"
          just check-source-trees-scoped-to-consumer || failed="$failed check-source-trees-scoped-to-consumer"
          just check-spec-governance-default-block || failed="$failed check-spec-governance-default-block"
          just check-tool-backed-check-completeness || failed="$failed check-tool-backed-check-completeness"
          just check-vendor-manifest || failed="$failed check-vendor-manifest"
          if [ -n "$failed" ]; then
            echo "Failed targets:$failed"
            exit 1
          fi

  # Quality gate over the ONE sanctioned pi extension (the TypeScript
  # `tool_call` footgun guard). Its OWN job rather than a batch line for the
  # same reason check-doctor-static has one: it is the only target needing a
  # toolchain the batch jobs do not set up — node, plus an `npm ci` from the
  # committed lockfile. Folding it into a batch would make every batched
  # scanner pay that install.
  #
  # This job is a GATING job, so it is listed in ci-green.needs below. That
  # listing is the whole point of the wiring: `master` requires exactly ONE
  # status context, ci-green, so a job absent from its needs: list runs and
  # reports but gates nothing.
  check-extension-quality:
    name: check-extension-quality
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.31.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      # Unlike the python jobs this is NOT a near-no-op: node is pinned in
      # .mise.toml but is not baked into the python sandbox image, so this step
      # is where it actually installs.
      - name: mise trust + install (installs the pinned node)
        run: |
          mise trust
          mise install

      - name: just check-extension-quality
        run: |
          # mise shims on PATH so the recipe's `npm`/`npx`/`node` resolve to the
          # pinned toolchain rather than whatever the image happens to carry.
          export PATH="$MISE_DATA_DIR/shims:$PATH"
          just check-extension-quality

  # livespec core's STATIC doctor phase over this repo's own SPECIFICATION/
  # tree. The checker (doctor_static.py — self-contained, bare python3) ships
  # with CORE, not with this Driver, so this job checks core out at the release
  # tag THIS repo pins (.livespec.jsonc compat.pinned) and points the recipe at
  # it via LIVESPEC_CORE_PLUGIN_ROOT. It gets its OWN job rather than a batch
  # line because it needs that second checkout, which no other target does.
  check-doctor-static:
    name: check-doctor-static
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.31.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The '*' also covers the .livespec-core checkout below. See check-python
      # for the full hosted container root-vs-checkout uid rationale.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Resolve pinned livespec core ref (.livespec.jsonc compat.pinned)
        id: corepin
        run: |
          pinned="$(grep -oE '"pinned"[[:space:]]*:[[:space:]]*"[^"]*"' .livespec.jsonc | head -1 | sed -E 's/.*:[[:space:]]*"([^"]*)".*/\1/')"
          echo "ref=${pinned:-master}" >> "$GITHUB_OUTPUT"

      - name: Checkout livespec core at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: thewoolleyman/livespec
          ref: ${{ steps.corepin.outputs.ref }}
          path: .livespec-core

      - name: just check-doctor-static
        run: |
          # In a container job, github.workspace (context) may be the HOST path;
          # $GITHUB_WORKSPACE (env) is the in-container mount, so derive the core
          # plugin root from it to stay container-correct.
          export LIVESPEC_CORE_PLUGIN_ROOT="${GITHUB_WORKSPACE}/.livespec-core/.claude-plugin"
          # Expose the SAME pinned core checkout as a sibling CLONE so
          # cross-repo citation resolution works on the runner.
          # `.livespec.jsonc` `cross_repo_targets.livespec.local_clone` is the
          # host-absolute /data/projects/livespec, which cannot exist here.
          # That matters more than it looks: an unreadable clone file is NOT
          # treated as "clone unavailable" — no_cross_spec_reference maps it to
          # an EMPTY heading set, and _validated_external_references then DROPS
          # every external_references entry for that repo, failing allowlisted
          # citations with the misleading "is not allowlisted". Pointing
          # LIVESPEC_SIBLING_CLONES_ROOT at a real checkout (it takes precedence
          # over local_clone) makes CI validate citations against core's ACTUAL
          # headings instead — strictly stronger than the allowlist fallback.
          mkdir -p "${GITHUB_WORKSPACE}/.livespec-siblings"
          ln -sfn "${GITHUB_WORKSPACE}/.livespec-core" \
            "${GITHUB_WORKSPACE}/.livespec-siblings/livespec"
          export LIVESPEC_SIBLING_CLONES_ROOT="${GITHUB_WORKSPACE}/.livespec-siblings"
          just check-doctor-static

  export-telemetry:
    name: export-telemetry
    needs: [check-python, check-coverage, check-per-file-coverage, check-python-batch, check-metadata, check-metadata-batch]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export CI run telemetry to Honeycomb (closed-loop verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC: ${{ secrets.HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC }}
        run: bash .github/scripts/export-ci-telemetry.sh

  # Single all-green gate job. This is the SOLE branch-protection required
  # context: it `needs:` every check-bearing job, so requiring only `ci-green`
  # blocks merges on the whole set via one stable context-name that never
  # churns as checks are added or rebatched. Pure GitHub-expression gate (no
  # external action, no direct tool invocation): `always()` runs it even when a
  # dependency failed, and the step fails the job iff any dependency failed or
  # was cancelled.
  ci-green:
    name: ci-green
    needs:
      - check-python
      - check-coverage
      - check-per-file-coverage
      - check-python-batch
      - check-metadata
      - check-metadata-batch
      - check-doctor-static
      - check-extension-quality
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
